server:
  port: ${SERVER_PORT:8095}
  servlet:
    context-path: /

spring:
  application:
    name: security-services-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/security_services_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 20MB

# Application Specific Configurations
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
  admin:
    default-username: ${ADMIN_USERNAME:admin}
    default-email: ${ADMIN_EMAIL:admin@securityservices.com}
    default-password: ${ADMIN_PASSWORD:Admin@123456}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    allowed-image-types: image/jpeg,image/png,image/webp
    allowed-resume-types: application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

logging:
  level:
    root: INFO
    com.securityservices: DEBUG
    org.hibernate.SQL: WARN
